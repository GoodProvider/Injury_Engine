plugin:
  name: "Injury_Engine"
  version: "0.2.1"
  description: "Torture damage for SkyrimNet: whipping, pinching, slapping, pulling, punching and companion fire / frost / shock, with wound narration and a Torture_Target action"
  icon: "🪢"

schema:
  fields:
    - name: "Injury Narration"
      path: "injury_engine.narration.injury_mode"
      type: "select"
      description: "Real-damage hits (slashing, piercing, burning, ...). Direct Narration: narrated when the actors are in sight and SkyrimNet has answered the last narration, otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Healing Narration"
      path: "injury_engine.narration.healing_mode"
      type: "select"
      description: "Healing of wounds (spells, staffs, potions, food): start, progress, fully healed or stopped. Direct Narration: narrated when the actors are in sight and SkyrimNet has answered the last narration, otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Death Narration"
      path: "injury_engine.narration.death_mode"
      type: "select"
      description: "Killing blows from real damage: the killing wound and the last moment. Direct Narration: narrated when the actors are in sight and SkyrimNet has answered the last narration, otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Torture Narration"
      path: "injury_engine.narration.torture_mode"
      type: "select"
      description: "Torture (whipping, pinching, slapping, pulling, punching, fire / frost / shock). Direct Narration: narrated when the actors are in sight and SkyrimNet has answered the last narration, otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Minimum damage for minor"
      path: "injury_engine.ranges.minor_min"
      type: "int"
      description: "Percent of a body part's maximum where a real wound becomes minor. Below it the wound counts (it holds health) but is not narrated and not described. Real damage only (slashing, piercing, burning, ...); torture keeps its own stages. One real point is 1% of max health; a core body part holds 100, small parts 10 or 5. No body part can hold a larger share of its maximum than the body has lost health, so while health is between 75% and 26% no part gets past minor."
      min: 1
      max: 100
      defaultValue: 25
      category: "Injury Ranges"

    - name: "Minimum damage for major"
      path: "injury_engine.ranges.major_min"
      type: "int"
      description: "Percent of a body part's maximum where a real wound becomes major (from minor's minimum up to this: minor narration). Real damage only (slashing, piercing, burning, ...); torture keeps its own stages. One real point is 1% of max health; a core body part holds 100, small parts 10 or 5. No body part can hold a larger share of its maximum than the body has lost health, so while health is between 75% and 26% no part gets past minor."
      min: 1
      max: 100
      defaultValue: 75
      category: "Injury Ranges"

    - name: "Minimum damage for severe"
      path: "injury_engine.ranges.severe_min"
      type: "int"
      description: "Percent of a body part's maximum where a real wound becomes severe (from major's minimum up to this: major narration; this and above: severe narration). Real damage only (slashing, piercing, burning, ...); torture keeps its own stages. One real point is 1% of max health; a core body part holds 100, small parts 10 or 5. No body part can hold a larger share of its maximum than the body has lost health, so while health is between 75% and 26% no part gets past minor."
      min: 1
      max: 100
      defaultValue: 90
      category: "Injury Ranges"

    - name: "Narrate lashes"
      path: "injury_engine.narration.enabled"
      type: "bool"
      description: "Send Direct Narrations for torture and healing. Torture is narrated when it starts, every few seconds while it continues, and when the method changes (the speech queue is cleared first when the player is involved); hits in between are short-lived events. Off: everything is recorded as short-lived events."
      defaultValue: true
      category: "Narration Options"

    - name: "Torture maximum break (sec)"
      path: "injury_engine.narration.torture_maximum_break"
      type: "float"
      description: "Torture counts as continuous while the pause between hits stays below this. A break this long ends the session with no narration; combined \"again\" lines stop for that pair."
      min: 0.5
      max: 30
      defaultValue: 3.0
      category: "Narration Options"

    - name: "Torture direct narration gap (sec)"
      path: "injury_engine.narration.torture_direct_narration_gap"
      type: "float"
      description: "During continuous torture, one combined narration (everyone torturing at the same time) is sent this often; hits in between are short-lived events. A change of method is narrated at once."
      min: 1
      max: 60
      defaultValue: 6.0
      category: "Narration Options"

    - name: "Wait for reply (sec)"
      path: "injury_engine.narration.reply_timeout"
      type: "float"
      description: "After a narration, the next one waits until SkyrimNet has spoken a reply, or until there has been no dialogue for this long. Hits in between are short-lived events."
      min: 3
      max: 120
      defaultValue: 15.0
      category: "Narration Options"

    - name: "Health narration cooloff (sec)"
      path: "injury_engine.narration.health_narration_cooloff"
      type: "float"
      description: "Real damage: at most one spoken narration this often (and only after SkyrimNet has answered the last narration); hits in between are short-lived events."
      min: 0
      max: 120
      defaultValue: 6.0
      category: "Narration Options"

    - name: "Narration max distance (m)"
      path: "injury_engine.narration.max_distance"
      type: "float"
      description: "Hits and healing farther than this from the player are not narrated: the first hit and healing are recorded as events, other hits as short-lived events."
      min: 5
      max: 100
      defaultValue: 15.0
      category: "Narration Options"

    - name: "Lash event lifetime (sec)"
      path: "injury_engine.narration.event_ttl"
      type: "float"
      description: "How long the short-lived event for a hit that was not narrated stays in the scene context."
      min: 5
      max: 300
      defaultValue: 30.0
      category: "Narration Options"

    - name: "NPC must already carry a whip"
      path: "injury_engine.action.require_whip"
      type: "bool"
      description: "On: only NPCs who already carry the padded whip can choose the whip in the Torture_Target action (pinching, slapping, pulling and punching need nothing). Off: any NPC can whip and is handed a whip for the lashing (taken back afterwards)."
      defaultValue: true
      category: "Action"

    - name: "Add gear to player"
      path: "injury_engine.action.give_to_player"
      type: "bool"
      description: "On: on load (and when settings are saved) give the player the padded whip and the spells Torture Flames, Torture Frostbite and Torture Sparks, each only if they don't have it yet. The torture spells cause fire / frost / shock torture wounds (in or out of combat) instead of real damage; the normal Flames, Frostbite and Sparks are unchanged and always do real damage. Turning it off takes nothing away."
      defaultValue: true
      category: "Action"

    - name: "Maximum lashes per action"
      path: "injury_engine.action.max_strikes"
      type: "int"
      description: "Most strikes (lashes, pinches, slaps, ...) the LLM can choose for one Torture_Target action. The action offers up to ten; this setting caps the count."
      min: 1
      max: 20
      defaultValue: 10
      category: "Action"

    - name: "Game hours per heal point"
      path: "injury_engine.healing.hours_per_point"
      type: "float"
      description: "Torture wounds lower health: each body part holds health down by its worst torture type, up to 90% of max health when every part is at maximum damage. Torture never takes health below 10% of max health, so it can't kill. Any healing heals wounds: health restored above the wounded level heals wound points, one at a time on a random wounded part, and each point lowers every torture type on that part. On top of that each body part loses one point of torture damage per this many game hours until it is healed. The visible decal is controlled by the engine and can vanish earlier (cell change or reload)."
      min: 0.1
      max: 24
      defaultValue: 1.0
      category: "Healing"

    - name: "Natural regen vs. torture wounds (%)"
      path: "injury_engine.healing.regen_rate"
      type: "float"
      description: "Natural health regeneration heals torture wounds at this percentage of its normal speed, so welts outlast the visible marks. Healing spells, staffs, scrolls and potions work at full speed. 100: regen heals wounds at normal speed."
      min: 0
      max: 100
      defaultValue: 10.0
      category: "Healing"

    - name: "Add Healing Hands to player"
      path: "injury_engine.healing.give_healing_hands"
      type: "bool"
      description: "On: teach the player Healing Hands on load. Any healing source (spell, staff, scroll, potion, food) on a wounded actor is narrated as it starts, while it continues, and when the wounds are fully healed or the healing stops. Healing by the player is always narrated; other healing follows the narration settings."
      defaultValue: true
      category: "Healing"

    - name: "Include sexual body parts (nipples, pussy, penis, lips, and ass hole)"
      path: "injury_engine.body.include_sexual_parts"
      type: "bool"
      description: "On: lashes and real damage can also wound the nipples, the pussy (women) or penis (men), the lips and the ass hole. These parts are small: they are hit less often and hold less damage than the face, back, arms and legs, but they are sensitive, so they still go through light, medium and severe wounds. Their wounds are described to the LLM like any other part. Turning it off stops new wounds on them and hides them from the LLM and the overlay; wounds already there keep healing."
      defaultValue: false
      category: "Body"

    - name: "Tortured victims collapse into bleedout until healed"
      path: "injury_engine.body.torture_bleedout"
      type: "bool"
      description: "On: when torture brings someone down to 15% health they collapse to the ground in the bleedout pose and stay down until their health has recovered above 15% (healing magic, potions, rest). The next torture narration says that they collapse. Off: they stay on their feet."
      defaultValue: true
      category: "Body"

    - name: "Minimum uncaused damage (%)"
      path: "injury_engine.body.uncaused_min_percent"
      type: "float"
      description: "Health lost with no attacker, no hit and no real fall (other mods' scripts, bathing or animation mods, stepping down stairs) becomes a wound only if it is still missing about 1.5 seconds later and is at least this percentage of max health. Damage that comes straight back is always ignored. 0: any lasting loss counts."
      min: 0
      max: 100
      defaultValue: 5.0
      category: "Body"

    - name: "Show torture overlay"
      path: "injury_engine.overlay.enabled"
      type: "bool"
      description: "Show a \"Torture Damage\" panel with one bar per tortured actor, most recently hit first. The bar shows the torture type that hit the actor last: its length is how much of that damage the actor holds, its color follows the type and the stage (light, medium, severe), and it turns light blue while a healing source works on the actor. Real damage that replaces torture damage grows a red part from the left. An actor drops off once their torture damage is gone, and the overlay fades a few seconds after the last change. Needs Magelight UI."
      defaultValue: true
      category: "Overlay"

    - name: "Verbose logging"
      path: "injury_engine.debug.verbose_logging"
      type: "bool"
      description: "On: write extra debug lines to Injury_Engine.log and Papyrus.0.log (hits, damage classification, health sync, healing, narration decisions). For troubleshooting; leave off in normal play."
      defaultValue: false
      category: "Debug"
