plugin:
  name: "Injury_Engine"
  version: "0.1.0"
  description: "Torture damage for SkyrimNet: whipping, pinching, slapping, pulling, punching and companion fire / frost / shock, with wound narration and a Torture_Target action"
  icon: "🪢"

schema:
  fields:
    - name: "Injury Narration"
      path: "injury_engine.narration.injury_mode"
      type: "select"
      description: "Real-damage hits (slashing, piercing, burning, ...). Direct Narration: narrated when allowed (in sight, speech queue free), otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Healing Narration"
      path: "injury_engine.narration.healing_mode"
      type: "select"
      description: "Healing of wounds (spells, staffs, potions): start, progress, pain gone, fully healed. Direct Narration: narrated when allowed (in sight, speech queue free), otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Death Narration"
      path: "injury_engine.narration.death_mode"
      type: "select"
      description: "Killing blows from real damage: the killing wound and the last moment. Direct Narration: narrated when allowed (in sight, speech queue free), otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "Torture Narration"
      path: "injury_engine.narration.torture_mode"
      type: "select"
      description: "Torture (whipping, pinching, slapping, pulling, punching, fire / frost / shock). Direct Narration: narrated when allowed (in sight, speech queue free), otherwise a short-lived event. Event: always a short-lived event only. Silent: nothing."
      defaultValue: "Direct Narration"
      options:
        - "Direct Narration"
        - "Event"
        - "Silent"
      category: "Narration"

    - name: "NPC must already carry a whip"
      path: "injury_engine.action.require_whip"
      type: "bool"
      description: "On: only NPCs who already carry the padded whip can choose the whip in the Torture_Target action (pinching, slapping, pulling and punching need nothing). Off: any NPC can whip and is handed a whip for the lashing (taken back afterwards)."
      defaultValue: true
      category: "Action"

    - name: "Add gear to player"
      path: "injury_engine.action.give_to_player"
      type: "bool"
      description: "On: on load (and when settings are saved) give the player the padded whip and the spells Flames (torture), Frostbite (torture) and Sparks (torture), each only if they don't have it yet. The torture spells cause fire / frost / shock torture wounds (in or out of combat) instead of real damage; the normal Flames, Frostbite and Sparks are unchanged and always do real damage. Turning it off takes nothing away."
      defaultValue: true
      category: "Action"

    - name: "Maximum lashes per action"
      path: "injury_engine.action.max_strikes"
      type: "int"
      description: "Most strikes (lashes, pinches, slaps, ...) the LLM can choose for one Torture_Target action. The action offers up to ten; this setting caps the count."
      min: 1
      max: 20
      defaultValue: 10
      category: "Action"

    - name: "Game hours per heal point"
      path: "injury_engine.healing.hours_per_point"
      type: "float"
      description: "Torture wounds lower health: each body part holds health down by its worst torture type (damage plus missing healing), up to 90% of max health when every part is at maximum damage. Torture never takes health below 10% of max health, so it can't kill. Any healing heals wounds: health restored above the wounded level becomes wound points, one point at a time on a random wounded part, and each point lowers every torture type on that part. Each body part also drains one point of damage per this many game hours, then gains one healing point at the same rate until healed (11 points). The visible decal is controlled by the engine and can vanish earlier (cell change or reload)."
      min: 0.1
      max: 24
      defaultValue: 1.0
      category: "Healing"

    - name: "Natural regen vs. torture wounds (%)"
      path: "injury_engine.healing.regen_rate"
      type: "float"
      description: "Natural health regeneration heals torture wounds at this percentage of its normal speed, so welts outlast the visible marks. Healing spells, staffs, scrolls and potions work at full speed. 100: regen heals wounds at normal speed."
      min: 0
      max: 100
      defaultValue: 10.0
      category: "Healing"

    - name: "Add Healing Hands to player"
      path: "injury_engine.healing.give_healing_hands"
      type: "bool"
      description: "On: teach the player Healing Hands on load. Any healing source (spell, staff, scroll, potion) on a tortured actor is narrated as it starts, when the pain is gone, and when the wounds are fully healed or the healing stops. Healing by the player is always narrated; other healing follows the narration settings."
      defaultValue: true
      category: "Healing"

    - name: "Narrate lashes"
      path: "injury_engine.narration.enabled"
      type: "bool"
      description: "Send Direct Narrations for torture and healing. Torture is narrated when it starts, every few seconds while it continues, and when the method changes (the speech queue is cleared first when the player is involved); hits in between are short-lived events. Off: everything is recorded as short-lived events."
      defaultValue: true
      category: "Narration"

    - name: "Torture narration window (sec)"
      path: "injury_engine.narration.torture_narration_window_size"
      type: "float"
      description: "After a torture hit, ordinary passive healing is not reported for this long, so it does not undo the punishment just narrated."
      min: 0
      max: 300
      defaultValue: 30.0
      category: "Narration"

    - name: "Torture maximum break (sec)"
      path: "injury_engine.narration.torture_maximum_break"
      type: "float"
      description: "Torture counts as continuous while the pause between hits stays below this. A break this long ends the session with no narration; combined \"again\" lines stop for that pair."
      min: 0.5
      max: 30
      defaultValue: 3.0
      category: "Narration"

    - name: "Torture direct narration gap (sec)"
      path: "injury_engine.narration.torture_direct_narration_gap"
      type: "float"
      description: "During continuous torture, one combined narration (everyone torturing at the same time) is sent this often; hits in between are short-lived events. A change of method is narrated at once."
      min: 1
      max: 60
      defaultValue: 6.0
      category: "Narration"

    - name: "Wait for reply (sec)"
      path: "injury_engine.narration.reply_timeout"
      type: "float"
      description: "After a narration, the next one waits until SkyrimNet has spoken a reply, or until there has been no dialogue for this long. Hits in between are short-lived events."
      min: 3
      max: 120
      defaultValue: 15.0
      category: "Narration"

    - name: "Health narration cooloff (sec)"
      path: "injury_engine.narration.health_narration_cooloff"
      type: "float"
      description: "Real damage: at most one spoken narration this often (when the speech queue is empty); hits in between are short-lived events."
      min: 0
      max: 120
      defaultValue: 6.0
      category: "Narration"

    - name: "Narration cooldown (sec)"
      path: "injury_engine.narration.cooldown"
      type: "float"
      description: "Healing: minimum seconds between narrations for the same actor; the speech queue must also be empty. Healing in between becomes short-lived events and is combined into the next narration. Torture uses the torture break and gap settings instead."
      min: 0
      max: 120
      defaultValue: 8.0
      category: "Narration"

    - name: "Narration max distance (m)"
      path: "injury_engine.narration.max_distance"
      type: "float"
      description: "Hits and healing farther than this from the player are not narrated: the first hit and healing are recorded as events, other hits as short-lived events."
      min: 5
      max: 100
      defaultValue: 15.0
      category: "Narration"

    - name: "Lash event lifetime (sec)"
      path: "injury_engine.narration.event_ttl"
      type: "float"
      description: "How long the short-lived event for a hit that was not narrated stays in the scene context."
      min: 5
      max: 300
      defaultValue: 30.0
      category: "Narration"

    - name: "Include sexual body parts (nipples, pussy, penis, lips, and ass hole)"
      path: "injury_engine.body.include_sexual_parts"
      type: "bool"
      description: "On: lashes and real damage can also wound the nipples, the pussy (women) or penis (men), the lips and the ass hole. These parts are small: they are hit less often and hold less damage than the face, back, arms and legs, but they are sensitive, so they still go through light, medium and severe wounds. Their wounds are described to the LLM like any other part. Turning it off stops new wounds on them and hides them from the LLM and the overlay; wounds already there keep healing."
      defaultValue: false
      category: "Body"

    - name: "Punching during combat is health not torture"
      path: "injury_engine.body.punch_combat_health"
      type: "bool"
      description: "Off: bare-fist punches by people are torture in and out of combat: they hold health down but cannot kill. On: punches thrown while the attacker is in combat are real bludgeoning damage and can kill."
      defaultValue: false
      category: "Body"

    - name: "Tortured victims collapse into bleedout until healed"
      path: "injury_engine.body.torture_bleedout"
      type: "bool"
      description: "On: when torture brings someone down to 15% health they collapse to the ground in the bleedout pose and stay down until their health has recovered above 15% (healing magic, potions, rest). The next torture narration says that they collapse. Off: they stay on their feet."
      defaultValue: true
      category: "Body"

    - name: "Show torture overlay"
      path: "injury_engine.overlay.enabled"
      type: "bool"
      description: "Show bars for each body part (head, body, arms, legs) of an actor while they are tortured or their wounds are healing (each part shows its worst torture type). Red bars grow with damage and darken through the stages; once a part's damage is gone a yellow bar shows its healing, and the bar disappears when the part is healed. Needs PrismaUI."
      defaultValue: true
      category: "Overlay"

    - name: "Verbose logging"
      path: "injury_engine.debug.verbose_logging"
      type: "bool"
      description: "On: write extra debug lines to Injury_Engine.log and Papyrus.0.log (hits, damage classification, health sync, healing, narration decisions). For troubleshooting; leave off in normal play."
      defaultValue: false
      category: "Debug"
