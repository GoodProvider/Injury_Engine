<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Injury Engine Overlay</title>
    <!--
        Whip damage overlay (C++ Overlay.cpp). Shown without Focus: no cursor, no input, game keeps running.
        C++ pushes injuryEngineUpdate({title, max, part_max, medium, severe, colors, source_colors,
                               actors:[{id, name, source, max, replaced, healing, parts:[points x6 or x11]}]})
        whenever the engine state changes (numbers from injuries/whipping.json, bar colors per torture type from each
        injuries/<type>.json overlay_colors); parts are head, body, right arm, left arm, right leg, left leg, then
        (with "include sexual parts") nipples, pussy, penis, lips, ass hole; part_max is each part's damage points in
        that order. whipReset() drops everything (new game / load / overlay turned off).
        Layout: #InjuryEnginePanel holds the title ("Torture Damage", white) above .actor-injuryengine-damage-bars, one bar per
        tortured actor, most recently hit first. Each bar shows the actor's latest torture type (`source`) alone:
        width = that type's points out of the actor's `max` (the parts the type reaches). Colored in the type's own
        hue (source_colors[source]) by the average points of its wounded parts (light / medium / severe), or light
        blue while a healing source works on the actor (`healing`: its heal session); a hit brings the type's color
        back. Real damage replaces torture damage: `replaced` points grow as a red segment from the left
        while the fill shrinks. Bars show only the actor's name.
        An actor whose whip damage is fully replaced (or healed, dead, unloaded) is dropped; with no bars the panel is
        hidden. The whole overlay fades IDLE_MS after the last change and comes back on the next one.
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --text-primary: #e8e6e1;
            --font-ui: 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', system-ui, sans-serif;
            --bar-width: 220px;
            --bar-height: 34px;
            --light: #a8dc8c;
            --medium: #4caf3a;
            --severe: #1f5e17;
            --healing: #8fd3ff;
            --replaced: #c8201e;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            pointer-events: none;
            font-family: var(--font-ui);
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
        }
        #overlay {
            position: absolute;
            top: 12%;
            right: 3%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #overlay.shown { opacity: 1; }
        #InjuryEnginePanel { display: none; flex-direction: column; gap: 6px; }
        #InjuryEnginePanel.active { display: flex; }
        .panel-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .actor-injuryengine-damage-bars { display: flex; flex-direction: column; gap: 6px; }
        .bar {
            position: relative;
            width: var(--bar-width);
            height: var(--bar-height);
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.35);
            overflow: hidden;
            transition: opacity 0.6s ease;
        }
        .bar.fading { opacity: 0; }
        .replaced, .fill {
            position: absolute;
            top: 0;
            bottom: 0;
            transition: width 0.4s ease, left 0.4s ease, background-color 0.4s linear;
        }
        .replaced { left: 0; width: 0; background-color: var(--replaced); }
        .fill { left: 0; width: 0; }
        .fill.light { background-color: var(--light); }
        .fill.medium { background-color: var(--medium); }
        .fill.severe { background-color: var(--severe); }
        .fill.healing { background-color: var(--healing); }
        .label {
            position: absolute;
            inset: 0;
            padding: 0 8px;
            line-height: var(--bar-height);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="InjuryEnginePanel">
            <div class="panel-title">Torture Damage</div>
            <div class="actor-injuryengine-damage-bars"></div>
        </div>
    </div>
    <script>
        const IDLE_MS = 3000;     // overlay fades this long after the last change
        const GONE_MS = 1500;     // fully healed: empty bar shown this long before its fade
        const FADE_MS = 600;
        // Replaced by the numbers in every push (injuries/whipping.json), these only cover the first frame.
        // partMax: damage points per part in `parts` order (6 parts, 11 with "include sexual parts").
        // sourceColors: torture type id -> {light, medium, severe}; a type without colors uses the CSS ones.
        const cfg = { max: 120, partMax: [20, 20, 20, 20, 20, 20], medium: 4, severe: 11, sourceColors: {} };

        const overlay = document.getElementById('overlay');
        const panel = document.getElementById('InjuryEnginePanel');
        const title = panel.querySelector('.panel-title');
        const root = panel.querySelector('.actor-injuryengine-damage-bars');
        const actors = new Map();  // id -> {bar, fill, replacedBar, label, name, source, max, parts, replaced, healing, sum, lastHit, gone}
        let lastChange = 0;

        const noParts = () => cfg.partMax.map(() => 0);

        function maxDamage(i) { return cfg.partMax[i] ?? cfg.max / cfg.partMax.length; }

        function damageStage(damage) {
            if (damage >= cfg.severe) return 'severe';
            if (damage >= cfg.medium) return 'medium';
            return 'light';
        }

        // Summary of the shown torture type: {state: hurting|healed, width % of max, cls, damage total}.
        function summarize(parts, healing, max) {
            let damage = 0, damaged = 0;
            for (const [i, p] of parts.entries()) {
                if (p > 0) {
                    damage += Math.min(p, maxDamage(i));
                    damaged++;
                }
            }
            if (!damaged) return { state: 'healed', width: 0, cls: '', damage: 0 };
            return { state: 'hurting', width: Math.min(damage / (max || cfg.max) * 100, 100),
                cls: healing ? 'healing' : damageStage(damage / damaged), damage };
        }

        function paint(a, sum) {
            // The replaced segment sits at the left, the torture fill follows it; together they stay within the bar.
            const replaced = sum.state === 'hurting' ? Math.min(a.replaced / (a.max || cfg.max) * 100, 100 - sum.width) : 0;
            a.replacedBar.style.width = replaced + '%';
            a.fill.className = 'fill ' + sum.cls;
            // The type's own hue; healing (and a type without colors) falls back to the CSS class color.
            const hue = !a.healing && cfg.sourceColors[a.source];
            a.fill.style.backgroundColor = (hue && hue[sum.cls]) || '';
            a.fill.style.left = replaced + '%';
            a.fill.style.width = sum.width + '%';
            a.label.textContent = a.name;
        }

        function create(id) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            const replacedBar = document.createElement('div');
            replacedBar.className = 'replaced';
            const fill = document.createElement('div');
            fill.className = 'fill';
            const label = document.createElement('div');
            label.className = 'label';
            bar.appendChild(replacedBar);
            bar.appendChild(fill);
            bar.appendChild(label);
            root.appendChild(bar);
            const parts = noParts();
            const a = {
                bar, fill, replacedBar, label, name: '',
                source: '', max: cfg.max, parts, replaced: 0, healing: false, sum: summarize(parts, false, cfg.max),
                lastHit: 0, gone: 0,
            };
            actors.set(id, a);
            return a;
        }

        // Returns true when the shown type, its parts, the replaced count or the heal session changed.
        function apply(a, source, max, parts, replaced, healing, now) {
            if (source === a.source && max === a.max && replaced === a.replaced && healing === a.healing &&
                JSON.stringify(parts) === JSON.stringify(a.parts)) return false;
            const prev = a.sum;
            const switched = source !== a.source && source !== '';
            const sum = summarize(parts, healing, max);
            a.source = source;
            a.max = max;
            a.parts = parts.slice();
            a.replaced = replaced;
            a.healing = healing;
            a.sum = sum;
            if (sum.damage > prev.damage || (switched && sum.damage > 0)) a.lastHit = now;
            paint(a, sum);
            return true;
        }

        function drop(id, a) {
            if (actors.get(id) !== a) return;
            a.bar.remove();
            actors.delete(id);
        }

        // Fully healed, replaced by real damage, dead or unloaded: fade the bar and drop it. A healed actor shows an
        // empty bar for GONE_MS first; one whose whip damage was replaced goes at once.
        function retire(id, a, now, immediate) {
            if (a.gone) return;
            a.gone = now;
            setTimeout(() => {
                if (actors.get(id) !== a) return;
                a.bar.classList.add('fading');
                setTimeout(() => drop(id, a), FADE_MS);
            }, immediate ? 0 : GONE_MS);
        }

        function configure(state) {
            if (typeof state.max === 'number') cfg.max = state.max;
            if (Array.isArray(state.part_max) && state.part_max.length) cfg.partMax = state.part_max;
            if (typeof state.medium === 'number') cfg.medium = state.medium;
            if (typeof state.severe === 'number') cfg.severe = state.severe;
            if (state.title) title.textContent = state.title;
            if (state.source_colors && typeof state.source_colors === 'object') cfg.sourceColors = state.source_colors;
            const style = document.documentElement.style;
            for (const [name, value] of Object.entries(state.colors || {})) {
                style.setProperty('--' + name.replace(/_/g, '-'), value);
            }
        }

        function injuryEngineUpdate(state) {
            const now = Date.now();
            configure(state || {});
            const seen = new Set();
            for (const s of (state && state.actors) || []) {
                const id = String(s.id);
                seen.add(id);
                let a = actors.get(id);
                if (a && a.gone) {
                    // Back before its bar was dropped: start fresh.
                    drop(id, a);
                    a = null;
                }
                a = a || create(id);
                a.name = s.name || '';
                const max = typeof s.max === 'number' && s.max > 0 ? s.max : cfg.max;
                if (apply(a, s.source || '', max, s.parts || noParts(), s.replaced || 0, !!s.healing, now)) lastChange = now;
                if (a.sum.state === 'healed') retire(id, a, now, false);
            }
            for (const [id, a] of actors) {
                if (seen.has(id) || a.gone) continue;
                const replacedAway = a.sum.state === 'hurting' && a.replaced > 0;
                if (apply(a, a.source, a.max, noParts(), 0, false, now)) lastChange = now;
                retire(id, a, now, replacedAway);
            }
            render();
        }

        function whipReset() {
            for (const a of actors.values()) a.bar.remove();
            actors.clear();
            lastChange = 0;
            overlay.classList.remove('shown');
            panel.classList.remove('active');
        }

        function render() {
            const order = [...actors.values()].sort((x, y) => y.lastHit - x.lastHit);
            // Most recent first; only touch the DOM when the order changed.
            if (order.some((a, i) => root.children[i] !== a.bar)) {
                for (const a of order) root.appendChild(a.bar);
            }
            // The panel (title + bars) exists only while some actor has whip damage to show.
            panel.classList.toggle('active', actors.size > 0);
            overlay.classList.toggle('shown', actors.size > 0 && Date.now() - lastChange < IDLE_MS);
        }

        setInterval(render, 250);

        window.injuryEngineUpdate = injuryEngineUpdate;
        window.whipReset = whipReset;
    </script>
</body>
</html>
